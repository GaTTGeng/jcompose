name: network-storage

services:
  app:
    image: example/app:network
    ports:
      - "127.0.0.1:8080:8081/tcp"
      - "9090:9091/udp"
    volumes:
      - app-data:/var/lib/app
    networks:
      - frontend
    labels:
      com.example.component: api

volumes:
  app-data:

networks:
  frontend:
