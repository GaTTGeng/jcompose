name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Docker Engine for integration coverage
        if: runner.os == 'Linux'
        run: docker info --format '{{.ServerVersion}}'
      - name: Verify all modules
        run: mvn --batch-mode --no-transfer-progress verify
